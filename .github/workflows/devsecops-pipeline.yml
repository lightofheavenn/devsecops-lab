name: Pipeline DevSecOps End-to-End

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  secret-scanning:
    name: 1. Secret Scanning (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@8ade135a41bc03ea155e62e844d188df1ea18608
        with:
          fetch-depth: 0
      - name: Gitleaks Scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  sast:
    name: 2. SAST (Semgrep)
    needs: secret-scanning
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@8ade135a41bc03ea155e62e844d188df1ea18608
      - name: Ejecutar Semgrep
        run: |
          docker run --rm -v "${{ github.workspace }}:/src" returntocorp/semgrep semgrep scan --config auto --error

  sca:
    name: 3. SCA (Trivy Filesystem)
    needs: secret-scanning
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@8ade135a41bc03ea155e62e844d188df1ea18608
      - name: Escaneo de librerías con Trivy
        uses: aquasecurity/trivy-action@8b2bcaafba3f13f1e4c9f9b9e58b9425f37885c2
        with:
          scan-type: 'fs'
          scan-ref: 'app/'
          severity: 'HIGH,CRITICAL'
          exit-code: '1'

  iac-security:
    name: 4. IaC Security (Checkov)
    needs: secret-scanning
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@8ade135a41bc03ea155e62e844d188df1ea18608
      - name: Escaneo de IaC con Checkov
        uses: bridgecrewio/checkov-action@8d3c958d99d6f80cee2762f46c62e2744735ad40
        with:
          directory: '.'
          framework: 'terraform,dockerfile'
          soft_fail: false

  build-and-sbom:
    name: 5. Build, Container Scan & SBOM
    needs: [sast, sca, iac-security]
    runs-on: ubuntu-latest
    env:
      REGISTRY: ghcr.io
      IMAGE_NAME: ${{ github.repository }}
    steps:
      - uses: actions/checkout@8ade135a41bc03ea155e62e844d188df1ea18608

      - name: Iniciar sesión en GitHub Container Registry
        uses: docker/login-action@9780b0c442fbb0697daaaeae3af4eac1c4421c3c
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extraer metadatos de la imagen
        id: meta
        uses: docker/metadata-action@8e54479cbfc0cd1869a7c73a982a7b3c6f90329f
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: type=sha

      - name: Compilar Imagen Docker Local
        uses: docker/build-push-action@4a13e500e55cf31b7a5d59a38ab2040ab0f42f56
        with:
          context: .
          load: true
          tags: ${{ steps.meta.outputs.tags }}

      - name: Generar SBOM con Syft
        uses: anchore/sbom-action@f50fcd37e616c12745955cf0f1fba49dabdb54eb
        with:
          image: ${{ steps.meta.outputs.tags }}
          format: cyclonedx-json
          output-file: 'sbom.cyclonedx.json'

      - name: Publicar SBOM como Artefacto
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882
        with:
          name: sbom-cyclonedx
          path: sbom.cyclonedx.json

      - name: Escaneo de Imagen Docker con Trivy
        uses: aquasecurity/trivy-action@8b2bcaafba3f13f1e4c9f9b9e58b9425f37885c2
        with:
          image-ref: ${{ steps.meta.outputs.tags }}
          severity: 'CRITICAL'
          exit-code: '1'

      - name: Publicar Imagen en GHCR
        uses: docker/build-push-action@4a13e500e55cf31b7a5d59a38ab2040ab0f42f56
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}

  sign-container:
    name: 6. Firma de Artefacto (Cosign Keyless)
    needs: build-and-sbom
    runs-on: ubuntu-latest
    env:
      REGISTRY: ghcr.io
      IMAGE_NAME: ${{ github.repository }}
    steps:
      - name: Instalar Cosign
        uses: sigstore/cosign-installer@59acb6260c9c0ba8f4a2f9d9b48431a222b68e20

      - name: Iniciar sesión en GHCR
        uses: docker/login-action@9780b0c442fbb0697daaaeae3af4eac1c4421c3c
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Firmar Imagen mediante Sigstore (OIDC Keyless)
        run: |
          IMAGE_REF="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:sha-${{ github.sha }}"
          cosign sign --yes "$IMAGE_REF"
